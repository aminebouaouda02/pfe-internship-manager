services:
  postgres:
    image: postgres:16-alpine
    container_name: pfe-manager-postgres
    environment:
      POSTGRES_DB: pfe_manager
      POSTGRES_USER: pfe_user
      POSTGRES_PASSWORD: pfe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfe_user -d pfe_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
