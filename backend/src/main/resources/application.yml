spring:
  application:
    name: pfe-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/pfe_manager
    username: pfe_user
    password: pfe_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    com.amine.pfemanager: INFO
    org.springframework.security: INFO
